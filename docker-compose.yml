version: '3.8'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: chatapp-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=sa@123456
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P sa@123456 -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - chatapp-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: chatapp-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping || exit 1
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - chatapp-network

volumes:
  sqlserver_data:
  rabbitmq_data:

networks:
  chatapp-network:
    driver: bridge
